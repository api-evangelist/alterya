name: Alterya
description: >-
  Alterya is an AI-powered fraud-prevention company founded in 2022 (Y Combinator; seed round
  led by Battery Ventures, ~$9.8M) that detects authorized-fraud scams — authorized push-payment
  (APP) scams, pig-butchering and romance scams, money-mule and synthetic accounts, and
  social-engineering-driven withdrawals — before victims send funds. It connects fraud signals
  across crypto rails and traditional fiat/bank rails, and prior to acquisition monitored more
  than $8B in transactions per month for exchanges and fintechs including Binance, Coinbase, and
  Block, protecting roughly 100M end users. Chainalysis acquired Alterya in January 2025 for a
  reported ~$150M; it now ships as the "Alterya by Chainalysis" fraud-prevention product. The
  standalone alterya.com domain is parked and the company operates entirely inside Chainalysis,
  with no independent public developer portal, API, or OpenAPI surface.
